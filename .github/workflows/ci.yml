name: CI and security gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2025]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned tooling and locked dependencies
        run: |
          python -m pip install uv==0.13.0
          uv sync --frozen --python "${{ matrix.python }}"
      - name: Lint, format, and strict type checks
        run: |
          uv run --frozen ruff check src tests .github/scripts
          uv run --frozen ruff format --check src tests .github/scripts
          uv run --frozen mypy src/loom
      - name: Offline contracts
        run: uv run --frozen pytest -q --junitxml=artifacts/offline.xml
      - name: Build, install wheel and sdist, and validate both SBOMs
        run: uv run --frozen python .github/scripts/ci.py package
      - name: Retain redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL security-extended
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python
          queries: security-extended
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.gz
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          output: artifacts/sarif
          upload: false
      - name: Fail closed on analysis errors or findings
        run: python .github/scripts/ci.py sarif
      - name: Retain SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif
          path: artifacts/sarif/
          if-no-files-found: error
          retention-days: 30

  mend:
    name: Mend / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    environment: security-scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: LINUX_X64
          - os: macos-14
            platform: MACOS_ARM64
          - os: macos-15-intel
            platform: MACOS_X64
          - os: windows-2025
            platform: WINDOWS_X64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.0
      - name: Verify approved binary and scan only exported public dependencies
        run: python .github/scripts/ci.py mend
        env:
          MEND_CLI_VERSION: ${{ vars.MEND_CLI_VERSION }}
          MEND_CLI_SHA256: ${{ vars[format('MEND_CLI_SHA256_{0}', matrix.platform)] }}
          MEND_CLI_URL: ${{ vars[format('MEND_CLI_URL_{0}', matrix.platform)] }}
          MEND_SCOPE: ${{ vars[format('MEND_SCOPE_{0}', matrix.platform)] }}
          MEND_URL: ${{ secrets.MEND_URL }}
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mend-evidence-${{ matrix.platform }}
          path: artifacts/mend-*.json
          if-no-files-found: error
          retention-days: 30
