name: Provisioned external acceptance

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the provisioned nonsecret provider/embedding configuration
        required: true
        type: string

permissions:
  contents: read

jobs:
  providers-and-embeddings:
    runs-on: [self-hosted, loom-acceptance]
    environment: provider-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install uv==0.13.0
          uv sync --frozen
      - name: Live provider, overflow, and prepared embedding contracts
        run: uv run --frozen pytest -q -o addopts="" -m "live or integration" --junitxml=artifacts/external.xml
        env:
          LOOM_LIVE_CONFIG: ${{ inputs.config_path }}
          LOOM_EMBEDDING_CONFIG: ${{ inputs.config_path }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-acceptance
          path: artifacts/external.xml
          if-no-files-found: error
